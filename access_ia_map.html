<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACCESS — Information Architecture Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }
    header {
      background: #8B0000;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header p { font-size: 0.82rem; opacity: 0.85; margin-top: 2px; }
    .controls {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .controls button {
      background: #8B0000;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .controls button:hover { background: #a00000; }
    .controls span { font-size: 0.8rem; color: #666; }
    #tree-container {
      overflow: auto;
      width: 100%;
      height: calc(100vh - 110px);
      background: #fafafa;
    }
    svg { display: block; }
    .node circle {
      stroke-width: 2px;
      cursor: pointer;
      transition: r 0.2s;
    }
    .node circle:hover { r: 10; }
    .node text {
      font-size: 12px;
      cursor: pointer;
      dominant-baseline: middle;
    }
    .node text:hover { text-decoration: underline; }
    .link {
      fill: none;
      stroke: #bbb;
      stroke-width: 1.5px;
    }
    .tooltip {
      position: fixed;
      background: rgba(0,0,0,0.82);
      color: #fff;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 0.78rem;
      pointer-events: none;
      max-width: 320px;
      word-break: break-all;
      z-index: 999;
      display: none;
    }
    .legend {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: #444; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  </style>
</head>
<body>
<header>
  <div>
    <h1>ACCESS Community — Information Architecture Map</h1>
    <p>Interactive tree of the site's curated navigation structure &nbsp;|&nbsp; Click any node to open the page &nbsp;|&nbsp; Click a branch label to collapse/expand</p>
  </div>
</header>
<div class="controls">
  <button onclick="expandAll()">Expand All</button>
  <button onclick="collapseAll()">Collapse All</button>
  <button onclick="resetZoom()">Reset View</button>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#8B0000"></div> Home</div>
    <div class="legend-item"><div class="legend-dot" style="background:#C0392B"></div> Top-level section</div>
    <div class="legend-item"><div class="legend-dot" style="background:#E8A0A0"></div> Sub-section</div>
    <div class="legend-item"><div class="legend-dot" style="background:#F5D5D5"></div> Page</div>
  </div>
  <span>Scroll to zoom &nbsp;|&nbsp; Drag to pan</span>
</div>
<div id="tree-container"></div>
<div class="tooltip" id="tooltip"></div>

<script>
const treeData = {
  label: "Home (Front Page)",
  href: "https://www.accesscommunity.org/",
  children: [
    { label: "Health & Wellness", href: "https://www.accesscommunity.org/health-wellness", children: [
      { label: "Medical", href: "https://www.accesscommunity.org/health-wellness/medical", children: [
        { label: "GLP-1 Program for Health & Wellness", href: "https://www.accesscommunity.org/health-wellness/medical/glp-1-program-health-wellness", children: [] },
        { label: "ACCESS Mobile Clinic", href: "https://www.accesscommunity.org/mobileclinic", children: [] }
      ]},
      { label: "Public Health", href: "https://www.accesscommunity.org/health-wellness/public-health", children: [] },
      { label: "Behavioral Health", href: "https://www.accesscommunity.org/health-wellness/behavioral-health", children: [
        { label: "Behavioral Health Home Program", href: "https://www.accesscommunity.org/health-wellness/behavioral-health/behavioral-health-home-program", children: [] }
      ]},
      { label: "Health Research", href: "https://www.accesscommunity.org/health-wellness/health-research", children: [] },
      { label: "For Researchers", href: "https://www.accesscommunity.org/health-wellness/researchers", children: [] },
      { label: "Contact", href: "https://www.accesscommunity.org/health-wellness/contact", children: [] },
      { label: "Arab Health Summit", href: "https://www.accesscommunity.org/health-wellness/arab-health-summit", children: [
        { label: "Health Summit Sponsorship", href: "https://www.accesscommunity.org/health-wellness/arab-health-summit/health-summit-sponsorship", children: [] }
      ]}
    ]},
    { label: "Education", href: "https://www.accesscommunity.org/education", children: [
      { label: "Youth & Young Adult Programs", href: "https://www.accesscommunity.org/education/youth-young-adult-programs", children: [] },
      { label: "Adult Programs", href: "https://www.accesscommunity.org/education/adult-programs", children: [] },
      { label: "Cultural Competency", href: "https://www.accesscommunity.org/education/cultural-competency", children: [] }
    ]},
    { label: "Youth", href: "https://www.accesscommunity.org/youth", children: [
      { label: "Academic Enrichment", href: "https://www.accesscommunity.org/youth/academic-enrichment", children: [] },
      { label: "Youth Empowerment", href: "https://www.accesscommunity.org/youth/youth-empowerment", children: [] },
      { label: "Recreational Programs", href: "https://www.accesscommunity.org/youth/recreational-programs", children: [] }
    ]},
    { label: "Employment Services", href: "https://www.accesscommunity.org/employment-services", children: [
      { label: "Employer Resources", href: "https://www.accesscommunity.org/employment-services/employer-resources", children: [] },
      { label: "Financial Stability", href: "https://www.accesscommunity.org/human-services/financial-stability", children: [] },
      { label: "Entrepreneur Resources", href: "https://www.accesscommunity.org/employment-services/entrepreneur-resources", children: [] },
      { label: "Job Seeker Resources", href: "https://www.accesscommunity.org/employment-services/job-seeker-resources", children: [] },
      { label: "ACCESS Career Path to Self-Sufficiency", href: "https://www.accesscommunity.org/employment-services/access-career-path-self-sufficiency-project", children: [] }
    ]},
    { label: "Human Services", href: "https://www.accesscommunity.org/human-services", children: [
      { label: "Caregiving Services", href: "https://www.accesscommunity.org/human-services/caregiving-services", children: [] },
      { label: "Senior Services", href: "https://www.accesscommunity.org/node/1612", children: [] },
      { label: "Basic Needs", href: "https://www.accesscommunity.org/human-services/basic-needs", children: [] },
      { label: "Immigration and Citizenship", href: "https://www.accesscommunity.org/human-services/immigration-and-citizenship", children: [] }
    ]},
    { label: "National Programs", href: "https://www.accesscommunity.org/national-programs", children: [
      { label: "Arab American National Museum", href: "https://www.accesscommunity.org/national-programs/arab-american-national-museum", children: [] },
      { label: "Center for Arab American Philanthropy", href: "https://www.accesscommunity.org/national-programs/center-arab-american-philanthropy", children: [] },
      { label: "National Network for Arab American Communities", href: "https://www.accesscommunity.org/national-programs/national-network-arab-american-communities", children: [] },
      { label: "MENA Communities", href: "https://www.accesscommunity.org/national-programs/middle-eastern-north-african-mena-communities", children: [] },
      { label: "Center for Arab Narratives", href: "https://www.accesscommunity.org/national-programs/center-arab-narratives", children: [] }
    ]},
    { label: "About", href: "https://www.accesscommunity.org/about", children: [
      { label: "Our Roots", href: "https://www.accesscommunity.org/about", children: [] },
      { label: "Mission & Vision", href: "https://www.accesscommunity.org/about/mission-vision", children: [] },
      { label: "Board of Directors", href: "https://www.accesscommunity.org/about/board-directors", children: [] },
      { label: "Executive Team", href: "https://www.accesscommunity.org/about/executive-team", children: [] },
      { label: "Annual Reports", href: "https://www.accesscommunity.org/about/annual-reports-0", children: [
        { label: "ACCESS Annual Report", href: "https://www.accesscommunity.org/about/annual-reports/access", children: [] },
        { label: "AANM Annual Report", href: "https://www.accesscommunity.org/about/annual-reports/arab-american-national-museum-aanm", children: [] },
        { label: "CAAP Annual Report", href: "https://www.accesscommunity.org/about/annual-reports/center-arab-american-philanthropy-caap", children: [] }
      ]}
    ]},
    { label: "News", href: "https://www.accesscommunity.org/news_", children: [
      { label: "Media", href: "https://www.accesscommunity.org/news/media", children: [] },
      { label: "Community Stories", href: "https://www.accesscommunity.org/news/community-stories", children: [] },
      { label: "In the News", href: "https://www.accesscommunity.org/news/news", children: [] },
      { label: "Press Releases", href: "https://www.accesscommunity.org/news/press-releases", children: [] },
      { label: "Newsletters", href: "https://www.accesscommunity.org/news/newsletters", children: [] }
    ]},
    { label: "Careers", href: "https://www.accesscommunity.org/careers", children: [] },
    { label: "Get Involved", href: "https://www.accesscommunity.org/get-involved", children: [
      { label: "Donate", href: "https://www.accesscommunity.org/get-involved", children: [] },
      { label: "Volunteer", href: "https://www.accesscommunity.org/get-involved/volunteer", children: [] },
      { label: "Where Your Money Goes", href: "https://www.accesscommunity.org/get-involved/where-your-money-goes", children: [] },
      { label: "Legacy Giving", href: "https://www.accesscommunity.org/get-involved/legacy-giving", children: [
        { label: "Legacy Gifts", href: "https://www.accesscommunity.org/support-us/legacy-giving/legacy-gifts", children: [] },
        { label: "Bequest Language", href: "https://www.accesscommunity.org/get-involved/legacy-giving/bequest-language", children: [] }
      ]}
    ]},
    { label: "Contact", href: "https://www.accesscommunity.org/contact", children: [
      { label: "Stay Connected", href: "https://www.accesscommunity.org/contact/stay-connected", children: [] },
      { label: "Departments & Locations", href: "https://www.accesscommunity.org/contact", children: [] },
      { label: "RFPs & RFQs", href: "https://www.accesscommunity.org/contact/rfps-rfqs", children: [
        { label: "Archived RFPs & RFQs", href: "https://www.accesscommunity.org/contact/rfps-rfqs/archived-rfps-rfqs", children: [] }
      ]}
    ]},
    { label: "Arabic Page", href: "https://www.accesscommunity.org/arabic", children: [] }
  ]
};

// Color by depth
const depthColors = ["#8B0000", "#C0392B", "#E8A0A0", "#F5D5D5"];
function nodeColor(d) { return depthColors[Math.min(d.depth, 3)]; }
function textColor(d) { return d.depth <= 1 ? "#fff" : "#333"; }

const container = document.getElementById("tree-container");
const tooltip = document.getElementById("tooltip");

const margin = { top: 30, right: 260, bottom: 30, left: 220 };
const width = 1400 - margin.left - margin.right;

const svg = d3.select("#tree-container").append("svg")
  .attr("width", width + margin.left + margin.right)
  .call(d3.zoom().scaleExtent([0.2, 3]).on("zoom", (event) => {
    g.attr("transform", event.transform);
  }));

const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

let root = d3.hierarchy(treeData);
root.x0 = 0;
root.y0 = 0;

// Collapse all children beyond depth 1 initially
root.descendants().forEach(d => {
  if (d.depth >= 1 && d.children) {
    d._children = d.children;
    d.children = null;
  }
});

let nodeId = 0;
const duration = 400;

function update(source) {
  const treeLayout = d3.tree().nodeSize([28, 240]);
  treeLayout(root);

  const nodes = root.descendants();
  const links = root.links();

  // Compute SVG height dynamically
  const ys = nodes.map(d => d.x);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const svgHeight = maxY - minY + margin.top + margin.bottom + 60;
  svg.attr("height", Math.max(svgHeight, 600));

  // Offset so tree starts at top
  const yOffset = -minY + margin.top;

  // --- Links ---
  const link = g.selectAll(".link").data(links, d => d.target.id);

  const linkEnter = link.enter().append("path")
    .attr("class", "link")
    .attr("d", d => {
      const o = { x: source.x0 + yOffset, y: source.y0 };
      return diagonal({ source: o, target: o });
    });

  link.merge(linkEnter).transition().duration(duration)
    .attr("d", d => diagonal({
      source: { x: d.source.x + yOffset, y: d.source.y },
      target: { x: d.target.x + yOffset, y: d.target.y }
    }));

  link.exit().transition().duration(duration)
    .attr("d", d => {
      const o = { x: source.x + yOffset, y: source.y };
      return diagonal({ source: o, target: o });
    }).remove();

  // --- Nodes ---
  const node = g.selectAll(".node").data(nodes, d => d.id || (d.id = ++nodeId));

  const nodeEnter = node.enter().append("g")
    .attr("class", "node")
    .attr("transform", d => `translate(${source.y0},${source.x0 + yOffset})`)
    .on("click", (event, d) => {
      if (d.data.href) {
        window.open(d.data.href, "_blank");
      }
    })
    .on("contextmenu", (event, d) => {
      event.preventDefault();
      if (d.children) { d._children = d.children; d.children = null; }
      else if (d._children) { d.children = d._children; d._children = null; }
      update(d);
    })
    .on("mouseover", (event, d) => {
      if (d.data.href) {
        tooltip.style.display = "block";
        tooltip.textContent = d.data.href;
      }
    })
    .on("mousemove", (event) => {
      tooltip.style.left = (event.clientX + 12) + "px";
      tooltip.style.top = (event.clientY - 28) + "px";
    })
    .on("mouseout", () => { tooltip.style.display = "none"; });

  nodeEnter.append("circle")
    .attr("r", 7)
    .attr("fill", d => nodeColor(d))
    .attr("stroke", d => d3.color(nodeColor(d)).darker(0.5));

  nodeEnter.append("text")
    .attr("dy", "0.35em")
      .attr("x", 12)
      .attr("text-anchor", "start")
      .text(d => d.data.label)
      .style("fill", "#333")
      .style("font-weight", d => d.depth <= 1 ? "bold" : "normal");

  // Expand/collapse indicator
  nodeEnter.filter(d => d._children || d.children).append("text")
    .attr("class", "toggle-icon")
    .attr("x", d => (d.children || d._children) ? -12 : 12)
    .attr("dy", "0.35em")
    .style("font-size", "10px")
    .style("fill", "#888")
    .style("pointer-events", "none");

  const nodeUpdate = node.merge(nodeEnter).transition().duration(duration)
    .attr("transform", d => `translate(${d.y},${d.x + yOffset})`);

  nodeUpdate.select("circle")
    .attr("r", 7)
    .attr("fill", d => nodeColor(d))
    .attr("stroke", d => d3.color(nodeColor(d)).darker(0.5));

  nodeUpdate.select("text")
    .attr("x", 12)
    .attr("text-anchor", "start")
    .text(d => d.data.label)
    .style("font-weight", d => d.depth <= 1 ? "bold" : "normal");

  node.exit().transition().duration(duration)
    .attr("transform", d => `translate(${source.y},${source.x + yOffset})`).remove();

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function diagonal(d) {
  return `M${d.source.y},${d.source.x}
    C${(d.source.y + d.target.y) / 2},${d.source.x}
     ${(d.source.y + d.target.y) / 2},${d.target.x}
     ${d.target.y},${d.target.x}`;
}

function expandAll() {
  root.descendants().forEach(d => {
    if (d._children) { d.children = d._children; d._children = null; }
  });
  update(root);
}

function collapseAll() {
  root.descendants().forEach(d => {
    if (d.depth >= 1 && d.children) { d._children = d.children; d.children = null; }
  });
  update(root);
}

function resetZoom() {
  svg.transition().duration(400).call(
    d3.zoom().transform,
    d3.zoomIdentity.translate(margin.left, margin.top)
  );
}

update(root);
</script>
</body>
</html>
